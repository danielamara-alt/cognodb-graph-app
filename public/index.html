<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph People</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Graph People</h1>
    <p class="subtitle">Explore people and their connections</p>

    <section class="card">
      <h2>Add Person</h2>

      <input
        type="text"
        id="personName"
        placeholder="Enter person's name"
      >

      <button onclick="addPerson()">Add Person</button>

      <p id="addResult"></p>
    </section>

    <section class="card">
      <h2>Create Connection</h2>

      <input
        type="text"
        id="person1"
        placeholder="First person's name"
      >

      <input
        type="text"
        id="person2"
        placeholder="Second person's name"
      >

      <button onclick="createConnection()">Connect</button>

      <p id="connectionResult"></p>
    </section>

    <section class="card">
      <h2>Find Connections</h2>

      <input
        type="text"
        id="searchName"
        placeholder="Enter person's name"
      >

      <button onclick="findConnections()">Find Connections</button>

      <div id="connectionsResult"></div>
    </section>

  </div>

  <script src="app.js"></script>

</body>
</html>
